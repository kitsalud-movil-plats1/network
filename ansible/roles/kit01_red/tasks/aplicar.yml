---
# D-23 y AGENTS.md sección 6: netplan generate y networkctl reload, nunca
# netplan apply ni netplan try. Si algo falla desde aquí, el play se detiene en
# este host y la restauración programada vuelve al netplan anterior
- name: Huella de las reglas de NetBird antes de aplicar
  ansible.builtin.shell: |
    set -o pipefail
    { iptables-save; ip6tables-save; } | awk '/NETBIRD/ && !/^:/' | sha256sum
  args:
    executable: /bin/bash
  register: kit01_red_netbird_antes
  changed_when: false

- name: Nombre de la restauración
  ansible.builtin.set_fact:
    kit01_red_unidad: "net-rollback-{{ now(fmt='%s') }}"

- name: Programar la restauración
  ansible.builtin.command: >-
    systemd-run --on-active={{ kit01_red_restauracion }} --unit={{ kit01_red_unidad }}
    sh -c 'cp {{ kit01_red_anterior }}/{{ kit01_red_netplan | basename }} {{ kit01_red_netplan }} && netplan generate && networkctl reload'
  changed_when: true

- name: Aplicar la red
  ansible.builtin.shell: netplan generate && networkctl reload
  changed_when: true

# Una conexión nueva, no la que ya estaba abierta (ControlPersist)
- name: Cerrar la conexión de Ansible
  ansible.builtin.meta: reset_connection

- name: Entrar de nuevo
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    timeout: 60
    delay: 5

- name: Huella de las reglas de NetBird después de aplicar
  ansible.builtin.shell: |
    set -o pipefail
    { iptables-save; ip6tables-save; } | awk '/NETBIRD/ && !/^:/' | sha256sum
  args:
    executable: /bin/bash
  register: kit01_red_netbird_despues
  changed_when: false
  failed_when: kit01_red_netbird_despues.stdout != kit01_red_netbird_antes.stdout

- name: NetBird conectado
  ansible.builtin.command: netbird status
  register: kit01_red_netbird_estado
  changed_when: false
  failed_when: kit01_red_netbird_estado.stdout is not search('Management:\s+Connected')
  when: kit01_netbird | bool

# La reconexión puede tardar más que su timeout si la conexión anterior quedó
# colgada. Solo vale lo comprobado si la restauración no actuó todavía
- name: ¿La restauración sigue pendiente?
  ansible.builtin.command: systemctl is-active {{ kit01_red_unidad }}.timer
  register: kit01_red_pendiente
  changed_when: false
  failed_when: false

- name: La restauración no actuó todavía
  ansible.builtin.assert:
    that: kit01_red_pendiente.stdout == 'active'
    fail_msg: >-
      La restauración {{ kit01_red_unidad }} ya actuó, así que la red volvió a lo anterior. El acceso tardó
      más de {{ kit01_red_restauracion }} s en volver con el cambio; se revisa antes de repetir
    quiet: true

- name: Cancelar la restauración
  ansible.builtin.command: systemctl stop {{ kit01_red_unidad }}.timer
  changed_when: true
