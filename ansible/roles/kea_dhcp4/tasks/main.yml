---
- name: Paquetes instalados
  ansible.builtin.package_facts:

# Con la configuración de fábrica no reparte en ninguna interfaz, pero igual se
# instala sin arrancar y arranca solo con la configuración del kit
- name: Impedir que el paquete arranque Kea al instalarse
  ansible.builtin.copy:
    dest: /usr/sbin/policy-rc.d
    content: "#!/bin/sh\nexit 101\n"
    mode: "0755"
    force: false
  register: kea_policy
  when: "'kea-dhcp4-server' not in ansible_facts.packages"

- name: Kea DHCPv4 con versión fija
  when: >-
    'kea-dhcp4-server' not in ansible_facts.packages or
    ansible_facts.packages['kea-dhcp4-server'][0].version != kea_version
  block:
    - name: Paquete kea-dhcp4-server
      ansible.builtin.apt:
        name:
          - "kea-dhcp4-server={{ kea_version }}"
          - "kea-common={{ kea_version }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
  always:
    - name: Quitar el bloqueo de arranque
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: kea_policy is changed

- name: Retener los paquetes de Kea
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kea-dhcp4-server, kea-common]

# AppArmor solo deja leer a kea-dhcp4 en /etc/kea/, así que se valida una copia ahí
- name: Configuración (validada con kea-dhcp4 -t)
  ansible.builtin.template:
    src: kea-dhcp4.conf.j2
    dest: /etc/kea/kea-dhcp4.conf
    owner: root
    group: _kea
    mode: "0640"
    validate: >-
      sh -c 'install -m 0640 -g _kea %s /etc/kea/.validar-dhcp4.conf &&
      kea-dhcp4 -t /etc/kea/.validar-dhcp4.conf; r=$?; rm -f /etc/kea/.validar-dhcp4.conf; exit $r'
  notify: Reiniciar Kea DHCPv4

- name: Kea DHCPv4 activo al arrancar
  ansible.builtin.systemd_service:
    name: kea-dhcp4-server
    enabled: true
    state: started
