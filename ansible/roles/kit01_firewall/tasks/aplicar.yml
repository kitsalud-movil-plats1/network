---
# D-23 y AGENTS.md sección 6. Si algo falla desde aquí, el play se detiene en
# este host y la restauración programada vuelve al ruleset anterior
- name: Huella de las reglas de NetBird antes de aplicar
  ansible.builtin.shell: |
    set -o pipefail
    { iptables-save; ip6tables-save; } | awk '/NETBIRD/ && !/^:/' | sha256sum
  args:
    executable: /bin/bash
  register: kit01_firewall_netbird_antes
  changed_when: false

- name: Sondas en rojo antes de aplicar
  ansible.builtin.shell: &kit01_firewall_rojas |
    set -o pipefail
    curl -sf -G --data-urlencode 'query=probe_success == 0' {{ kit01_firewall_prometheus }}/api/v1/query |
      python3 -c 'import json,sys; print("\n".join(sorted(r["metric"]["job"] + " " + r["metric"]["instance"] for r in json.load(sys.stdin)["data"]["result"])))'
  args:
    executable: /bin/bash
  register: kit01_firewall_rojas_antes
  changed_when: false
  when: kit01_firewall_sondas | bool

# Lo activo, en un archivo que se puede cargar: cada tabla se declara, se
# borra y se vuelve a crear. Una tabla que no existía solo se borra
- name: Ruleset activo para la restauración
  ansible.builtin.shell: |
    {
    {% for t in kit01_firewall_tablas %}
    echo "table {{ t }}"; echo "delete table {{ t }}"
    {% endfor %}
    {% for t in kit01_firewall_tablas %}
    nft -s list table {{ t }} 2>/dev/null || true
    {% endfor %}
    } > {{ kit01_firewall_tmp }}/anterior.nft
    nft -c -f {{ kit01_firewall_tmp }}/anterior.nft
  changed_when: false

# Las MAC autorizadas, como comandos que las vuelven a agregar con el tiempo
# que les queda. Recrear la tabla las borraría
- name: Elementos de los sets dinámicos
  ansible.builtin.shell: |
    set -o pipefail
    : > {{ kit01_firewall_tmp }}/elementos.nft
    {% for d in kit01_firewall_sets_dinamicos %}
    if nft list set {{ d.familia }} {{ d.tabla }} {{ d.set }} >/dev/null 2>&1; then
      nft -j list set {{ d.familia }} {{ d.tabla }} {{ d.set }} | python3 -c '
    import json, sys
    s = [o["set"] for o in json.load(sys.stdin)["nftables"] if "set" in o][0]
    for e in s.get("elem", []):
        e = e.get("elem", e) if isinstance(e, dict) else {"val": e}
        t = " timeout %ds" % max(1, e["expires"]) if "expires" in e else ""
        print("add element {{ d.familia }} {{ d.tabla }} {{ d.set }} { %s%s }" % (e["val"], t))
    ' >> {{ kit01_firewall_tmp }}/elementos.nft
    fi
    {% endfor %}
    wc -l < {{ kit01_firewall_tmp }}/elementos.nft
  args:
    executable: /bin/bash
  register: kit01_firewall_elementos
  changed_when: false

- name: Nombre de la restauración
  ansible.builtin.set_fact:
    kit01_firewall_unidad: "fw-rollback-{{ now(fmt='%s') }}"

- name: Programar la restauración
  ansible.builtin.command: >-
    systemd-run --on-active={{ kit01_firewall_restauracion }} --unit={{ kit01_firewall_unidad }}
    sh -c 'nft -f {{ kit01_firewall_tmp }}/anterior.nft{{ " && cp /etc/nftables.conf.anterior /etc/nftables.conf" if kit01_firewall_archivo is changed else "" }}'
  changed_when: true

# En un solo comando, para que las MAC vuelvan apenas se recrea la tabla. Las
# de un set que ya no existe se descartan
- name: Aplicar el firewall y volver a agregar las MAC autorizadas
  ansible.builtin.shell: |
    nft -f /etc/nftables.conf || exit 1
    while read -r l; do nft "$l" 2>/dev/null || echo "descartado: $l"; done < {{ kit01_firewall_tmp }}/elementos.nft
  changed_when: true

# Una conexión nueva, no la que ya estaba abierta (ControlPersist)
- name: Cerrar la conexión de Ansible
  ansible.builtin.meta: reset_connection

- name: Entrar de nuevo
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    timeout: 60
    delay: 2

- name: El ruleset activo es el del archivo
  ansible.builtin.shell: |
    candidato=$(unshare --net sh -c 'nft -f /etc/nftables.conf && { {% for t in kit01_firewall_tablas %}nft -s -t list table {{ t }} 2>/dev/null; {% endfor %}}')
    activo=$({% for t in kit01_firewall_tablas %}nft -s -t list table {{ t }} 2>/dev/null; {% endfor %})
    [ "$candidato" = "$activo" ]
  args:
    executable: /bin/bash
  changed_when: false

- name: Huella de las reglas de NetBird después de aplicar
  ansible.builtin.shell: |
    set -o pipefail
    { iptables-save; ip6tables-save; } | awk '/NETBIRD/ && !/^:/' | sha256sum
  args:
    executable: /bin/bash
  register: kit01_firewall_netbird_despues
  changed_when: false
  failed_when: kit01_firewall_netbird_despues.stdout != kit01_firewall_netbird_antes.stdout

- name: NetBird conectado
  ansible.builtin.command: netbird status
  register: kit01_firewall_netbird_estado
  changed_when: false
  failed_when: kit01_firewall_netbird_estado.stdout is not search('Management:\s+Connected')
  when: kit01_netbird | bool

# Las sondas se repiten cada 15 s; se espera a que todas pasen con el firewall nuevo
- name: Sondas en rojo con el firewall nuevo
  ansible.builtin.shell: *kit01_firewall_rojas
  args:
    executable: /bin/bash
  register: kit01_firewall_rojas_despues
  changed_when: false
  retries: 6
  delay: 10
  until: kit01_firewall_rojas_despues.stdout_lines | difference(kit01_firewall_rojas_antes.stdout_lines) | length == 0
  when: kit01_firewall_sondas | bool

- name: Flujos en uso
  ansible.builtin.shell: "{{ item.comando }}"
  args:
    executable: /bin/bash
  delegate_to: "{{ item.equipo }}"
  loop: "{{ kit01_firewall_comprobaciones }}"
  loop_control:
    label: "{{ item.equipo }}: {{ item.nombre }}"
  changed_when: false

# La reconexión puede tardar más que su timeout si la conexión anterior quedó
# colgada. Solo vale lo comprobado si la restauración no actuó todavía
- name: ¿La restauración sigue pendiente?
  ansible.builtin.command: systemctl is-active {{ kit01_firewall_unidad }}.timer
  register: kit01_firewall_pendiente
  changed_when: false
  failed_when: false

- name: La restauración no actuó todavía
  ansible.builtin.assert:
    that: kit01_firewall_pendiente.stdout == 'active'
    fail_msg: >-
      La restauración {{ kit01_firewall_unidad }} ya actuó, así que el firewall volvió a lo anterior. El acceso tardó
      más de {{ kit01_firewall_restauracion }} s en volver con el cambio; se revisa antes de repetir
    quiet: true

- name: Cancelar la restauración
  ansible.builtin.command: systemctl stop {{ kit01_firewall_unidad }}.timer
  changed_when: true
